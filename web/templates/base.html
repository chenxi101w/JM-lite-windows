<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/app_icon.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}">
<script>
/* 尽早应用本地主题，避免闪白 */
(function () {
  try {
    var t = localStorage.getItem('jm_lite_theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-brand">
      <span class="side-logo">JM</span>
      <span class="side-brand-txt">轻量版 <small>v{{ app_version }}</small></span>
    </div>
    <nav class="side-nav">
      <a class="side-item{% if active == 'search' %} is-active{% endif %}" href="/search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
        <span>搜索</span>
      </a>
      <a class="side-item{% if active == 'library' %} is-active{% endif %}" href="/library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M18 20V6"/></svg>
        <span>书架</span>
      </a>
      <a class="side-item{% if active == 'subscriptions' %} is-active{% endif %}" href="/subscriptions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>订阅</span>
      </a>
      <a class="side-item{% if active == 'downloads' %} is-active{% endif %}" href="/downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        <span>下载</span>
        <span class="side-badge" id="dlBadge" hidden>0</span>
      </a>
      <a class="side-item{% if active == 'settings' %} is-active{% endif %}" href="/settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9"/><circle cx="17" cy="7" r="2.4"/><path d="M20 17h-9"/><circle cx="7" cy="17" r="2.4"/></svg>
        <span>设置</span>
      </a>
    </nav>
    <div class="side-foot">
      <span class="side-ver">v{{ app_version }}</span>
      <span class="spacer"></span>
      <button id="themeToggle" class="icon-btn" title="切换明暗主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
<script src="{{ url_for('static', filename='js/reader-logic.js') }}?v={{ app_version }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}?v={{ app_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
